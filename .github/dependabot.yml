version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "no-ai-review"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per ecosystem cluster rather than a swarm of singletons.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-minor:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # `@types/vscode` is pinned to exactly the `engines.vscode` floor and is
      # not a dependency that tracks its own latest. It is what tells the
      # compiler which VS Code APIs exist, so holding it at the floor is what
      # makes `tsc` reject an API that the oldest host we claim to support does
      # not have.
      #
      # `vsce` enforces the same rule from the other side: it refuses to package
      # when `@types/vscode` is greater than `engines.vscode`
      # (`validateVSCodeTypesCompatibility`), so a bump on its own cannot pass
      # the required `package` check no matter what else is green. Dependabot
      # proposed 1.104.0 -> 1.125.0 inside the `dev-tooling` group on 2026-08-17
      # (PR #33); this entry stops the same guaranteed-red proposal arriving
      # every Monday.
      #
      # Move it only in the same change that raises `engines.vscode` — which is
      # a support decision, not a dependency update.
      - dependency-name: "@types/vscode"

      # `typescript` is held below 6.1 by `typescript-eslint`, not by us.
      # `typescript-eslint@8.67.0` — and the `@typescript-eslint/parser` and
      # `@typescript-eslint/eslint-plugin` packages it brings with it — each
      # declare `peerDependencies.typescript: ">=4.8.4 <6.1.0"`, so any
      # TypeScript at or above 6.1.0 fails `npm ci` with `ERESOLVE` before a
      # single file is compiled. Dependabot proposed 6.0.3 -> 7.0.2 on
      # 2026-08-17 (PR #35); ten checks went red on that one install failure,
      # repeated once per job.
      #
      # The bound is the peer range rather than "no majors" on purpose. 6.1.0
      # is a *minor* update and is equally unsatisfiable, so ignoring only
      # major versions would let the same guaranteed-red proposal arrive under
      # a different name. Patch releases within 6.0.x still flow.
      #
      # Lift this the day typescript-eslint ships a release that widens the
      # range: read `peerDependencies.typescript` on that version and raise the
      # bound here to match, rather than deleting the entry.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci", "no-ai-review"]
    commit-message:
      prefix: "ci(deps)"
