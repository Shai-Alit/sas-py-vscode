name: Claude Review

# Independent AI review of every PR. Comment-only for now (not a required
# check) so we can tune signal-to-noise before making it blocking.
#
# Skip a run the same way as the Codex reviewer (ai-review.yml), so one opt-out
# silences both bots: add the "no-ai-review" label to the PR, or put a flag in
# the head commit message ([skip-review], [no-review], or [skip ai-review]).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs when a PR gets new commits.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, Dependabot noise, and PRs carrying the opt-out label. (The
    # commit-message flag is handled by the guard step below, since the head
    # commit message isn't in the pull_request event payload.)
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Opt-out via the head commit message, mirroring the Codex reviewer's
      # SKIP_RE. The message isn't in the event payload, so read it via the API;
      # when it carries a flag, the review steps below are skipped.
      - name: Check for a skip flag in the head commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          message=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" \
            --jq '.commit.message' 2>/dev/null || true)
          if printf '%s' "$message" | grep -qiE '\[(skip[- ]review|no[- ]review|skip ai[- ]?review)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip flag in head commit message; skipping Claude review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          fetch-depth: 1

      # Authenticates against Sean's personal Claude subscription (Pro/Max)
      # instead of the Azure Foundry deployment, to move review cost off
      # metered Foundry billing. CLAUDE_CODE_OAUTH_TOKEN is a one-year token
      # from `claude setup-token` (see code.claude.com/docs/en/authentication),
      # NOT the ~1-day interactive /login session token — the latter is not
      # viable for unattended CI use (anthropics/claude-code-action#727).
      # Usage counts against the subscription's own limits, not a separate
      # per-repo budget. Repo secret set by Sean directly in GitHub, never via
      # this session.
      #
      # Pinned to the major tag; the Foundry-specific inputs (use_foundry,
      # ANTHROPIC_FOUNDRY_RESOURCE, ANTHROPIC_DEFAULT_HAIKU_MODEL) are gone
      # along with the azure/login step, since there's no Azure credential to
      # federate anymore.
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude_code_oauth_token authenticates the *model* only; the action
          # still needs a *GitHub* token to read the PR and post comments. With
          # no github_token input it tries to mint one by exchanging the
          # workflow's GitHub OIDC token, which requires `id-token: write` in
          # this job's permissions. We deliberately don't grant that (it was
          # dropped with the Foundry/azure-login federation in #71), so pass the
          # default workflow token instead — contents:read + pull-requests:write
          # above cover inline review comments and `gh pr comment`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an independent reviewer for `sas-py-vscode`, a VS Code
            extension that runs Python on SAS Viya (via PROC PYTHON over the
            Compute REST API) so users need no local Python installation, targeting
            Viya 4 behind a dialect layer (Viya 3.5 support was dropped, ADR-0022).
            Review this PR as a senior TypeScript / VS Code extension maintainer.

            Design intent is in PRODUCTION_PLAN.md. Verified Viya behaviour lives
            in the Probe findings section of each docs/phases/phase-N.md — see
            STATUS.md for the current phase. Check the phase file for the slice
            under review, and earlier phases' files if the claim could have been
            settled before this slice started; flag any claim about Viya behaviour
            those files do not support. Much of the connection layer is ported
            from the Apache-2.0 sassoftware/vscode-sas-extension. The PR branch is
            already checked out.

            Focus, in priority order:
            - Correctness & error handling: no empty/swallowing `catch` (the one
              sanctioned exception is fail-soft capability probing, which must say
              so in a comment); every network call has a timeout and an abort path;
              no unbounded recursion in retry/refresh paths — upstream has known
              304 and 412 self-recursion bugs, do not reproduce them; disposables
              are disposed.
            - Security: no secrets, tokens, or Authorization headers in logs,
              errors, fixtures, or the output channel; tokens in SecretStorage
              only; PKCE verifiers use `crypto.randomBytes`, never `Math.random()`
              (upstream gets this wrong — ported security code is audited, not
              transcribed); Python submitted to PROC PYTHON is escaped so a string
              containing `endsubmit;` or SAS macro syntax cannot break out;
              webviews are CSP-locked with no `unsafe-inline` or remote scripts.
            - Viya version handling: differences between Viya releases belong in
              `src/dialects/`, never as inline `if (version === ...)` elsewhere;
              capability differences are probed and degraded gracefully, not
              assumed.
            - TypeScript quality: `strict` honoured — no `any`, no unchecked casts
              across API boundaries, no `!` on legitimately nullable values; TSDoc
              on exported API; no `console.log` in shipped code (use the output
              channel).
            - VS Code integration: user-facing strings go through `l10n.t()`;
              `package.json` contributions match the implementation; long
              operations are cancellable and report progress; activation stays
              lazy; workspace-trust posture respected.
            - Tests: unit tests mock at the HTTP boundary with no network; every
              error branch has a regression test; fixtures exist per Viya
              generation and are sanitised. REJECT any test that copies the logic
              under test into the test file — that is the specific upstream
              mistake this project exists to avoid.
            - Licensing & hygiene: ported files keep the SAS copyright header AND
              carry a modified-file notice (Apache-2.0 §4(b)); docs and CHANGELOG
              updated when behaviour changes; an ADR added when a design decision
              is settled.

            Be specific and concise. Use inline comments for line-specific issues
            and a single summary comment with an overall assessment. Rate blocking
            issues clearly. Only post GitHub comments — do not submit review text
            as chat messages. If the PR looks good, say so briefly.

          # The review model is set with --model (the action has no `model`
          # input). This is a direct Anthropic model ID now, not a Foundry
          # deployment name — same string, different resolution path.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
