#
# The REST footprint this extension depends on for SAS Viya 3.5.
#
# It is empty, and the emptiness is the content. Stage-1 capability probing
# identifies a deployment as 3.5 by *not* finding something, so the thing that is
# not found has to be written down somewhere — otherwise the only record of what
# 3.5 lacks is a branch in the code, which is exactly what `src/dialects/` exists
# to prevent.
#
# **Nothing in this file has been observed.** This project has never had a Viya
# 3.5 deployment to run against, and it says so in `src/dialects/dialect.ts` too.
# Everything here is documented behaviour or inference from a Viya 4. Findings
# 40–45 in `PROBE-FINDINGS.md` record how the absence was simulated — a missing
# sibling path and an unrouted service on a Viya 4 — and why that is not the same
# as having seen it.

generation: viya35
dialect: createViya35Dialect
fixtures: viya35
reference: https://go.documentation.sas.com/doc/en/calcdc/3.5/calwlcm/home.htm

# Nothing yet. Slice 3a is the first thing that will talk to a 3.5 deployment,
# and endpoints arrive here when they are used, not when they are imagined.
endpoints: []

# Endpoints this generation is known to lack.
#
# An absence is only a signal if something else has the thing, so every id here
# must appear as an endpoint in another contract — the checker enforces that. It
# is what stops this list from decaying into a note about an endpoint that no
# longer exists anywhere.
absent:
  - id: cadence_version
    reason: >
      `/deploymentData` is a Viya 4 service. Viya 3.5 has no cadence versioning
      at all — releases are named, not dated — so there is no equivalent
      endpoint to point at rather than a differently-shaped one. Its considered
      absence is therefore as close to a version number as 3.5 offers, which is
      why §2.3 uses it.
    # Finding 42: the status code alone does not carry this. A 404 from an
    # ingress with nothing routed behind it is bodyless, and a proxy or a VPN
    # portal produces something in the same family — so a 404 read as "3.5"
    # would let anything in the network path manufacture a confident wrong
    # answer. The probe requires a genuine Viya error document *and* a
    # connected Compute session behind it before it will claim this.
    detected_as: absent-link-relation-or-viya-404
