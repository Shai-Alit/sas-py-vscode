#
# The REST footprint this extension depends on for SAS Viya 4.
#
# This file is documentation that fails the build when it stops being true.
# `scripts/check-contracts.mjs` asserts that it, the dialect layer under
# `src/dialects/`, and the fixture directories under `test/fixtures/` still agree
# — in both directions, so a generation cannot quietly lose its contract and a
# contract cannot quietly name a dialect that no longer exists.
#
# It is **not** shipped in the VSIX and **not** read at run time. The parser is a
# devDependency, which is the whole reason this can be YAML with comments in it:
# the comments are the point, and nothing in `src/` pays for them.
#
# When a probe changes what we know, this file changes in the same pull request
# as the code and the fixtures. A contract updated afterwards is a contract
# nobody was checking.

generation: viya4
dialect: createViya4Dialect
fixtures: viya4
reference: https://developer.sas.com/rest-apis

# Every endpoint is reached one of two ways, and says which:
#
#   path:  composed against the deployment origin. ADR-0010 makes the origin the
#          only base, so each of these is a URL we build ourselves and therefore
#          a URL that can break when the service moves. Keep the list short.
#   via:   followed from a link relation in another endpoint's response. This is
#          how the service expects to be navigated and it cannot break on a path
#          change. `observed_href` records what the relation actually pointed at
#          when it was probed — for the reader, never for the client to compose.
#
# Declaring both is an error. So is declaring neither.
endpoints:
  # ── Compute: contexts, sessions, jobs ──────────────────────────────────────
  #
  # One chain, declared in the order it is walked. Two entries below compose a
  # URL — `compute_contexts` and `compute_session_attach`, which are the only two
  # composed URLs in the project — and every other one names the relation it is
  # followed from, which is why each `via.from` points at the endpoint whose
  # response carried the link.
  #
  # Three relations that involve no representation are declared below with
  # `type: null` **and** `accept: null` — `session_cancel`, `session_delete` and
  # `job_cancel`. Until slice 2c-ii they could not be written at all:
  # `scripts/check-contracts.mjs` required both to be strings, and a session's
  # `cancel` and `delete` omit `type` entirely while a job's carry `type: null`
  # (finding 46). The checker now accepts either field as a media type **or**
  # null, while still requiring the key to be written — see the notes beside
  # those two checks for why the key and its value are different questions.
  #
  # `accept: null` is a claim about what the *client* sends, not about the link:
  # `acceptFor` in `src/compute/client.ts` uses a link's `responseType` and falls
  # back to `type` only on a `GET`, so a `PUT` or `DELETE` link carrying neither
  # produces a request with no `Accept` header. Writing a media type there would
  # have put three headers in the inventory that no request has ever carried.
  #
  # The job's fourth such relation, `delete`, is **deliberately not declared**,
  # which is a change from the plan this comment used to carry. Nothing in this
  # extension follows it, and that is load-bearing rather than incidental:
  # reading a `404` from a job resource as "the session is gone" (finding 53) is
  # only sound while nothing here can have deleted the job. `src/compute/job.ts`
  # says so beside `cancelJob`. Declaring an endpoint we have decided not to have
  # would put a footprint in the inventory that the code does not depend on, and
  # this file is the record of what we depend on.
  - id: compute_contexts
    method: GET
    path: /compute/contexts
    accept: application/vnd.sas.collection+json
    # The first of the project's two composed paths — the other is
    # `compute_session_attach` below, and there are no others. `resolveContext`
    # sends a `filter=eq(name,'…')` with the apostrophe doubled (finding 22) and
    # reads the first match; `listContexts` follows `next` to the end.
    response_fields: [items, links]
    # `createSession` arrives on the *summary* item (finding 15), carrying both
    # media types, so a session is started without the extra GET of the full
    # context that upstream does. `count` is deliberately absent from this list:
    # it is `null` whenever the collection is truncated (finding 16), which is
    # exactly when a pager would want it.
    item_fields: [id, name, links]

  - id: compute_session_create
    method: POST
    via:
      from: compute_contexts
      relation: createSession
      type: application/vnd.sas.compute.session.request
    observed_href: /compute/contexts/{contextId}/sessions
    accept: application/vnd.sas.compute.session+json
    # A `201` carrying `Location`, an `ETag` and the whole representation — 22
    # link relations, which is the entire session API (finding 21). The
    # `Location` is not followed: the body already holds what it points at.
    # `attributes.sessionInactiveTimeout` is 900 on the observed deployment and
    # is read rather than assumed, because it is a configurable and 2a-ii puts
    # the number in front of the user.
    response_fields: [id, state, attributes, links]

  - id: compute_session_attach
    method: GET
    path: /compute/sessions/{sessionId}
    accept: application/vnd.sas.compute.session+json
    # The second composed path, and the exception that proves the rule. ADR-0012
    # persists a session id so a reloaded window gets its Python namespace back,
    # and there is no link left to follow: the representation that carried the
    # links died with the previous window, so a stored id is all that survives.
    # A `404` here is the whole answer — the session is gone and a new one is the
    # only remedy (finding 29's uniform 404).
    #
    # Declared here rather than in 2a-ii, which wrote it. An inventory that omits
    # a URL the code composes is exactly the gap this file exists to close, and
    # the checker cannot find it: nothing walks `src/` looking for requests.
    response_fields: [id, state, attributes, links]

  - id: compute_session_state
    method: GET
    via:
      from: compute_session_create
      relation: state
      type: text/plain
    observed_href: /compute/sessions/{sessionId}/state
    # `text/plain`, and the body is the bare word — `pending`, seven bytes with
    # no trailing newline. With an `If-None-Match` and `?wait=N` it is a long
    # poll that answers `304` when the window elapses (findings 19 and 28); with
    # no validator the `wait` is inert.
    accept: text/plain

  - id: session_cancel
    method: PUT
    via:
      from: compute_session_create
      relation: cancel
      # Omitted on the wire for a session, `null` for a job (findings 21 and 46).
      # Both mean the same thing and are written the same way here: a `PUT` whose
      # entire payload is `?value=canceled` in the href sends no representation.
      type: null
    # The href arrives with its query string already on it, which makes this a
    # link to follow rather than a request to build — and makes it the reason
    # anything appending a parameter to a Viya href has to test for an existing
    # `?`. No `If-Match`: sending no validator is what removes the `412` that
    # upstream answers by recursing into itself without a bound.
    observed_href: /compute/sessions/{sessionId}/state?value=canceled
    # Nothing is read back, and nothing is *asked for*: the link carries no
    # `responseType`, and `acceptFor` falls back to `type` only on a `GET`, so
    # this request goes out with no `Accept` header at all. `null` says so. A
    # `200` here means the request was accepted, not that whatever was running
    # has stopped.
    accept: null

  - id: session_delete
    method: DELETE
    via:
      from: compute_session_create
      relation: delete
      # Omitted on the wire, as on `session_cancel` above, and written here as an
      # explicit claim for the reason given there.
      type: null
    observed_href: /compute/sessions/{sessionId}
    # `204` with no `If-Match` (finding 18). A `404` is treated as success: this
    # runs on teardown, usually underneath some other failure, and "the session
    # you wanted gone is gone" is the outcome that was asked for.
    #
    # No `Accept` is sent — a `DELETE` link with no `responseType`.
    accept: null

  - id: job_create
    method: POST
    via:
      from: compute_session_create
      relation: execute
      type: application/vnd.sas.compute.job.request
    observed_href: /compute/sessions/{sessionId}/jobs
    accept: application/vnd.sas.compute.job+json
    # `{name, code: [...statements]}` in, `201` out. The job representation is
    # six fields and ten relations (finding 46); `state` is `pending` there, so
    # a create response never carries an answer about completion. Neither the
    # `name` nor the `code` is echoed back — unlike a session's name — and the
    # `ETag` on the reply is not read, because nothing sends a validator to a job.
    response_fields: [id, state, links]

  - id: job_state
    method: GET
    via:
      from: job_create
      relation: state
      type: text/plain
    observed_href: /compute/sessions/{sessionId}/jobs/{jobId}/state
    # `text/plain`, read unconditionally. The five states a job does not come
    # back from are `done`, `canceled`, `error`, `warning` and `completed`; only
    # `error` and `completed` have been observed (finding 53) and the other three
    # are kept because a missing terminal state is a loop that never exits.
    accept: text/plain

  - id: job_log
    method: GET
    via:
      from: job_create
      relation: log
      type: application/vnd.sas.collection
    observed_href: /compute/sessions/{sessionId}/jobs/{jobId}/log
    accept: application/vnd.sas.collection+json
    # `?start=N&limit=L&timeout=T`. `timeout` really long-polls (finding 48) and
    # is always sent: without it the loop is a busy-wait that looks correct.
    # There is **no `ETag`** on this collection, so `start` is the entire cursor,
    # and expiry is a `200` with `items: []` rather than a `304` (finding 49).
    # The drain follows `next` until it is absent — it disappears even on a full
    # final page (finding 51). `count` is a live running total here rather than
    # the null of finding 16, and is still not read: it is stale on a running job.
    response_fields: [items, links]
    # Exactly three keys, no timestamp and no sequence number, so position in the
    # collection is the only ordering there is. `type` is an open set — `source`,
    # `note`, `normal`, `error` observed — and `note` is a catch-all that covers
    # blank and whitespace-only lines (finding 52), so it is passed through
    # rather than switched on. `version` is the item's representation version and
    # is not read.
    item_fields: [line, type]

  - id: job_cancel
    method: PUT
    via:
      from: job_create
      relation: cancel
      # Explicitly `null` here, where the session's is absent (finding 46). The
      # difference is the deployment's, not ours, and it is why the checker had
      # to accept both before either could be written down.
      type: null
    observed_href: /compute/sessions/{sessionId}/jobs/{jobId}/state?value=canceled
    # Same shape as `session_cancel` and the same four decisions: follow the href
    # with its query intact, send no `If-Match`, send no `Accept`, read nothing
    # back.
    #
    # **Whether the job actually stops promptly is unmeasured** — whether a
    # long-running Python step responds to cancellation or runs to the end of the
    # step first is an open probe question. So the contract for this endpoint is
    # "the request was accepted" and nothing stronger.
    accept: null

  # ── Compute: filerefs (submission-fidelity corpus, slice 3-pre) ────────────
  #
  # The upload half of ADR-0014's mechanism — create a fileref, write its
  # content — and nothing else. `src/compute/fileref.ts` does not compose
  # `proc python infile=<fileref>;`; that belongs to slice 3a, on top of these
  # two entries plus `job_create` above. Findings 35, 36 and 57.
  - id: fileref_create
    method: POST
    via:
      from: compute_session_create
      relation: assign
      type: application/vnd.sas.compute.fileref.request
    observed_href: /compute/sessions/{sessionId}/filerefs
    accept: application/vnd.sas.compute.fileref+json
    # `{name, path}` in, `201` out. Finding 36 recorded the response `id` equal
    # to the requested `name`, seven links (`self`, `alternate`, `deassign`,
    # `content`, `upload`, `append`, `delete`), and `accessMethod: "DISK"`.
    # Finding 57 added the type each of those links advertises, and measured a
    # bare relative `path` resolving under the session's own run directory —
    # which is why `createFileref` sends one value for both `name` and `path`.
    # This module reads only `id` and the links it follows.
    response_fields: [id, links]

  - id: fileref_get
    method: GET
    via:
      from: fileref_create
      relation: self
      type: application/vnd.sas.compute.fileref
    observed_href: /compute/sessions/{sessionId}/filerefs/{filerefId}
    accept: application/vnd.sas.compute.fileref+json
    # Read for its `ETag` alone, immediately before every content write —
    # `writeFilerefContent`'s own comment says why the create response's `ETag`
    # is not reused. Finding 36 measured this `GET`'s `ETag` as the one that
    # made the content `PUT` below succeed, and finding 57 reproduced it across
    # five filerefs. Whether it equals the create response's `ETag` is still
    # unmeasured, which is what keeps the extra `GET` here.
    response_fields: [id, links]

  - id: fileref_content_put
    method: PUT
    via:
      from: fileref_create
      relation: upload
      # Not a SAS vendor type: a raw byte upload has no JSON envelope, so
      # nothing here goes through the `+json` suffixing every other `via.type`
      # relies on. Finding 57 measured the `upload` relation advertising
      # `application/octet-stream` **itself**, so this is the link's own type
      # being followed, not a value the code supplies. `client.ts`'s `rawBody`
      # arm carries the same string as its default for a link that names no
      # type; that arm is not the one taken here.
      type: application/octet-stream
    observed_href: /compute/sessions/{sessionId}/filerefs/{filerefId}/content
    # `428 Precondition Required` with no `If-Match`, `201` with the `ETag`
    # from `fileref_get` (findings 36 and 57). `accept: null` is a measured
    # absence like the rest of this file's: finding 57 enumerated the `upload`
    # relation's types and it carries no `responseType`. `fileref.ts` reads
    # nothing from this response but its status either way.
    #
    # Reading the content back to prove fidelity is the live tier's job, and it
    # does so as a test concern rather than something this extension depends on
    # at run time, so no `fileref_content_get` id is declared here — though
    # finding 57 records what that `GET` answers, including that its
    # `Content-Type` is sniffed rather than echoed.
    accept: null

  # ── Capability probing ─────────────────────────────────────────────────────
  - id: deployment_data_root
    method: GET
    path: /deploymentData
    accept: application/vnd.sas.api+json
    # A link document and nothing else. `links[]` is the only field read.
    response_fields: [links]
    # Finding 44: `method` is `null` on every link here, so the verb comes from
    # this file rather than from the document. `type` is not decoration — the
    # `cadenceVersion` relation appears **twice**, distinguished only by it, so
    # code that selects on `rel` alone gets whichever came first.
    item_fields: [rel, href, type]

  - id: cadence_version
    method: GET
    via:
      from: deployment_data_root
      relation: cadenceVersion
      type: application/vnd.sas.deployment.data.cadence.version
    observed_href: /deploymentData/cadenceVersion
    # `application/json` is on the 406's list of acceptable types (finding 43)
    # and gives back a stable `application/json` rather than a versioned vendor
    # type. We read two fields and have no use for the representation version.
    accept: application/json
    # `cadenceVersion` is `2026.03` — the shape `CADENCE` in
    # `src/dialects/resolve.ts` already anchors on. `cadenceDisplayName` is
    # "Long-Term Support 2026.03", which is the string for the output channel:
    # it names the release and the support track in one line.
    #
    # Deliberately absent: `cadenceRelease` is a build stamp and must not be
    # ordered, and `cadenceName` is the track on its own, which the display name
    # already carries.
    response_fields: [cadenceVersion, cadenceDisplayName]
    # This is the whole of stage-1 capability probing (PRODUCTION_PLAN.md §2.3).
    # Its absence is the Viya 3.5 signal — see `viya35.yaml`, which exists to
    # record that absence and nothing else.
