name: CI

# The gate. Everything here is reproducible locally — `npm run verify` is the
# same command, not a subset of it — so a red build is always something you can
# reproduce on your own machine. See docs/dev/ci.md.

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. No job here needs to write to the repository, and the
# two jobs that produce something write it to an artifact instead. If a future
# job needs more, grant it on that job rather than widening this.
permissions:
  contents: read

# A superseded run tells you about code nobody is looking at any more. Keyed on
# the PR when there is one and the ref otherwise, so pushes to main are not
# cancelled by each other's PRs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which tiers this change actually needs.
  #
  # A pull request that only touches prose cannot break the compiler, the unit
  # tier, the VSIX or the lockfile, and running those jobs anyway costs tens of
  # minutes of wall clock to tell us something we already knew. This job
  # classifies the diff once and the expensive jobs gate on it, on two axes:
  #
  #   `code` — not unambiguously documentation. Gates verify, test, package.
  #   `deps` — can change the dependency tree or the supply-chain gate itself
  #            (package.json, the lockfile, .npmrc, the audit script/allow-list,
  #            a workflow). Gates supply-chain only. Narrower than `code`
  #            because a source or test edit that leaves the lockfile alone
  #            would make `supply-chain` re-derive what it already proved on
  #            `main` — a ~9-minute npm-12 install + `npm audit` round trip for
  #            no new information.
  #
  # Gating with `if:` rather than a top-level `paths-ignore` is deliberate. A
  # path filter makes the whole workflow *not run*, which leaves any required
  # status check pending forever; a job skipped by `if:` reports success under
  # its own name, so branch protection stays satisfiable. See docs/dev/ci.md.
  #
  # The classification is deliberately conservative: anything that is not
  # unambiguously documentation counts as code. `.github/**` counts as code even
  # when it is markdown, because a change to this file must be exercised by the
  # jobs it configures.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs enough history to diff against the base branch. 0 is the
          # blunt, always-correct answer for a repository this size.
          fetch-depth: 0

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main is the last line of defence — never narrow it.
            {
              echo "code=true"
              echo "deps=true"
            } >> "$GITHUB_OUTPUT"
            echo "not a pull request: running everything"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")

          echo "changed files:"
          echo "$changed"

          # `code`: anything that is not unambiguously documentation — gates
          # verify, test and package. Documentation-only means under docs/ or a
          # markdown file outside .github/; everything else (source, tests,
          # package.json, workflows) is code.
          other=$(echo "$changed" | grep -Ev '^docs/|^[^/]+\.md$' || true)

          # `deps`: a change that can alter the dependency tree or the
          # supply-chain gate itself — package.json, the lockfile, .npmrc, the
          # audit script or its allow-list, or a workflow. Only these change
          # what `supply-chain` would find; a code change that leaves them alone
          # would re-derive what the job already proved on `main`. Deliberately
          # narrower than `code` so a source or test edit does not pay the
          # ~9-minute npm-12 install + `npm audit` round trip for nothing.
          deps_changed=$(echo "$changed" | grep -E '^(package\.json|package-lock\.json|\.npmrc|scripts/check-audit\.mjs|scripts/advisory-allowlist\.json|\.github/workflows/)' || true)

          if [ -z "$other" ]; then code=false; else code=true; fi
          if [ -z "$deps_changed" ]; then deps=false; else deps=true; fi

          {
            echo "code=$code"
            echo "deps=$deps"
          } >> "$GITHUB_OUTPUT"
          echo "classification: code=$code deps=$deps"

  # Everything platform-independent, once. Splitting these into separate steps
  # would give prettier failure annotations and would also let CI and the local
  # command drift apart a step at a time; running the real `verify` is worth
  # reading one extra line of log to find out which stage failed.
  verify:
    name: verify
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version contributors are told to use, read from one place so
          # this file cannot disagree with it.
          node-version-file: .nvmrc
          cache: npm

      # `ci`, never `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is a thing worth failing on.
      - run: npm ci

      - run: npm run verify

      # Uploaded even on failure — when the coverage ratchet is what failed, the
      # report is the thing you need to see.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The tiers that can behave differently per platform. Both Node versions are
  # deliberate. 22.18.0 is the exact floor `engines.node` claims to support —
  # the Node that VS Code 1.104 embeds in its extension host — and a claimed
  # floor nobody tests is a guess. When that leg moves, the floor in
  # package.json moves with it, in the same pull request.
  #
  # 24 is the current Active LTS, and is here to catch a forward break before a
  # VS Code upgrade delivers one. It replaced a second leg pinned to `.nvmrc`,
  # which duplicated the floor leg once the floor became 22. See
  # docs/adr/0018-the-node-baseline.md.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # One platform failing is information about that platform, not a reason to
      # stop finding out about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      # The integration tier launches a real VS Code, which needs a display.
      # Windows and macOS runners have one; Linux does not, so it gets a virtual
      # framebuffer. `-a` picks a free display number rather than assuming :99
      # is unused. xvfb is preinstalled on the GitHub Ubuntu image, so nothing
      # is installed here — if that ever changes this step fails loudly, which
      # is better than an apt-get on every run to guard against a maybe.
      - name: integration tier (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: integration tier
        if: runner.os != 'Linux'
        run: npm run test:integration

  # The documentation, held to the same standard as the code: generated tables
  # must match their source, embedded samples must compile, and internal links
  # must resolve. `npm run check:docs` is the whole of it, and it is the command
  # to run locally when this job is red.
  #
  # External links are deliberately absent. They are swept weekly by
  # link-check.yml, which opens an issue instead of failing a merge — see
  # docs/dev/ci.md for why that asymmetry is on purpose.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check:docs

      # The one check that must run even when nothing but prose changed. It is
      # here rather than in `verify` alone because `verify` is skipped on a
      # documentation-only pull request, and a pasted token in a markdown file
      # is exactly as leaked as one in a source file. It costs a second.
      #
      # GitHub's own push protection does not cover this: it matches partner
      # patterns, and a Viya OAuth token is a self-minted JWT that will never
      # match one. See ADR-0006.
      - run: npm run check:secrets

      # Reviewing a documentation change by reading a diff of markdown is worse
      # than looking at the rendered page, and the build has already happened.
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  # Proves the extension can actually be packaged, and — via check:package,
  # which `npm run package` chains — that the package contains what it should
  # and nothing else. That second half is the point: .vscodeignore is
  # allow-by-default, so a packaging mistake ships rather than failing.
  package:
    name: package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run package

      # Installable from any run. Reviewing behaviour is much easier when the
      # reviewer can install the branch instead of building it.
      - uses: actions/upload-artifact@v7
        with:
          name: python-on-viya-vsix
          path: dist/python-on-viya.vsix
          if-no-files-found: error
          retention-days: 14

  # Two questions about the dependency tree: what is allowed to run code at
  # install time, and which advisories have been looked at. See ADR-0005.
  #
  # This job is pinned rather than folded into the matrix, and that is the whole
  # design. `allowScripts` is understood only by npm 12+, and npm 12 requires
  # Node ^22.22.2 || ^24.15.0 || >=26.0.0 — above the 22.18.0 floor that
  # `engines.node` claims and that three legs of `test` deliberately exercise. So
  # the control cannot run everywhere without moving the project's support
  # floor, which is not a decision a security slice should make as a side
  # effect. It runs in the one place that can run it.
  #
  # Be clear-eyed about what that buys: every *other* job here installs with
  # those install scripts running, because no runner ships npm 12 — the Node 22
  # legs get npm 10.x and the Node 24 legs npm 11.x, and neither has
  # `allowScripts`.
  # This job is the gate on what enters the lockfile, not a guarantee about how
  # any given machine installed it. docs/dev/ci.md says so out loud.
  #
  # Gated on `deps`, not `code`: what this job checks — the install-script
  # policy and the advisory set — is entirely a function of the lockfile, so a
  # source or test change that does not touch it re-derives the result already
  # proved on `main`. `npm run test:unit` still checks `allowScripts` against
  # the lockfile on every `code` change (it needs no network or npm 12); this
  # job adds the npm-12 `strict-allow-scripts` enforcement and `npm audit`.
  supply-chain:
    name: supply-chain
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # No Node release ships npm 12 — even Node 26 ships 11.x — so it is always
      # a deliberate install. Pinned to the major because a future npm major
      # could change what `allowScripts` means, and that should arrive as a
      # decision rather than as a Tuesday morning surprise.
      - run: npm install -g npm@^12.0.0

      # `strict-allow-scripts=true` in .npmrc turns npm's "install scripts
      # blocked" warning into ESTRICTALLOWSCRIPTS and a non-zero exit, so a new
      # dependency that wants to run code at install time fails here until
      # somebody approves or denies it on purpose.
      - run: npm ci

      # Advisories: nothing at all in the production tree, and nothing in the
      # dev tree that is not in scripts/advisory-allowlist.json with a reason
      # and an unexpired date. Needs the network, which is why it is not part of
      # `npm run verify`.
      - run: npm run check:audit

  # The one required status check.
  #
  # Branch protection requires exactly one context from this workflow: this job.
  # It passes only when every job it needs either succeeded or was deliberately
  # skipped by its own `if:`. So a documentation-only pull request — which skips
  # verify, test, package and supply-chain — still merges without an
  # administrator override, while a real failure in any of those jobs blocks the
  # merge here.
  #
  # Why an aggregate rather than requiring each job by name: `test` is a matrix,
  # and its status is reported under six expanded names
  # (`test (ubuntu-latest, node 24)` and so on) that exist only on a run where
  # the matrix actually expands. On a run where `test` is skipped they are never
  # reported at all, so a branch-protection rule that names them waits for them
  # forever and the pull request cannot be merged without an admin. Depending on
  # the matrix job *here* — where a skipped `needs` entry is visible as
  # `skipped` rather than simply absent — lets branch protection name one stable
  # check, and adding or dropping a matrix leg never touches repository settings
  # again. `analyze` lives in codeql.yml and cannot be a `needs:` of this job,
  # so it stays a required check in its own right. See docs/dev/ci.md.
  #
  # `if: always()` so the job runs even when every dependency was skipped —
  # otherwise it would inherit the skip and report nothing, which is the exact
  # gap it exists to close.
  ci-required:
    name: ci-required
    needs: [changes, verify, test, docs, package, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job must have succeeded or been skipped
        env:
          RESULTS: |
            changes=${{ needs.changes.result }}
            verify=${{ needs.verify.result }}
            test=${{ needs.test.result }}
            docs=${{ needs.docs.result }}
            package=${{ needs.package.result }}
            supply-chain=${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          # A job `result` is one of success, failure, cancelled, skipped.
          # success and skipped are both fine here; matching the other two
          # positively means a blank line cannot read as a failure.
          if printf '%s\n' "$RESULTS" | grep -E '=(failure|cancelled)$'; then
            echo "::error::ci-required: a needed job failed or was cancelled"
            exit 1
          fi
          echo "all needed jobs succeeded or were legitimately skipped"
